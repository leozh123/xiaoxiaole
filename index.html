<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>拯救大象 - 消消乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#1a1a2e;color:#fff;user-select:none}
#app{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}
.bg-layer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.bg-layer .leaf{position:absolute;font-size:1.5rem;opacity:.3;animation:leafFall linear infinite}
@keyframes leafFall{0%{transform:translateY(-50px) rotate(0);opacity:0}10%{opacity:.3}90%{opacity:.3}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.top-bar{width:100%;max-width:400px;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;z-index:10;flex-shrink:0}
.level-badge{background:rgba(255,255,255,.12);backdrop-filter:blur(10px);padding:6px 14px;border-radius:20px;font-size:.85rem;font-weight:600}
.score-box{background:rgba(247,201,72,.15);padding:6px 14px;border-radius:20px;font-size:.85rem;font-weight:700;color:#f7c948}
.target-panel{width:calc(100% - 32px);max-width:368px;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border-radius:14px;padding:10px 14px;margin-bottom:8px;z-index:10;flex-shrink:0;border:1px solid rgba(255,255,255,.06)}
.target-title{font-size:.78rem;color:#aaa;margin-bottom:6px}
.target-items{display:flex;gap:10px;justify-content:center}
.target-item{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.3);padding:4px 10px;border-radius:10px;font-size:.82rem}
.target-item.done{background:rgba(34,197,94,.25);text-decoration:line-through;opacity:.5}
.t-icon{font-size:1.2rem}
.t-count{color:#f7c948;font-weight:700;margin-left:2px}
.grid-container{flex:1;width:100%;max-width:400px;display:flex;align-items:center;justify-content:center;padding:4px 16px;z-index:10;min-height:0}
.grid{display:grid;gap:3px;width:100%;aspect-ratio:1;background:rgba(255,255,255,.04);border-radius:12px;padding:4px}
.cell{border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:clamp(1.4rem,5vw,2.2rem);cursor:pointer;transition:all .12s;position:relative;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.06)}
.cell:active{transform:scale(.88)}
.cell.selected{border-color:#f7c948;box-shadow:0 0 12px rgba(247,201,72,.35);transform:scale(1.05)}
.cell.hint{animation:hintPulse .8s infinite}
@keyframes hintPulse{0%,100%{box-shadow:0 0 0 0 rgba(247,201,72,0)}50%{box-shadow:0 0 14px 3px rgba(247,201,72,.4)}}
.cell.matching{animation:matchPop .35s ease forwards}
@keyframes matchPop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(0);opacity:0}}
.cell.falling{animation:fallIn .25s ease}
@keyframes fallIn{from{transform:translateY(-60px);opacity:0}to{transform:translateY(0);opacity:1}}
.cell.swapping{transition:left .18s,top .18s;z-index:5}
.hint-bar{width:100%;max-width:400px;padding:6px 16px 14px;z-index:10;flex-shrink:0;text-align:center}
.hint-text{font-size:.76rem;color:#555}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:all}
.modal{background:#1e1e3a;border-radius:22px;padding:32px 26px;text-align:center;max-width:300px;width:calc(100% - 48px);border:1px solid rgba(255,255,255,.1);transform:scale(.9);transition:transform .3s}
.overlay.show .modal{transform:scale(1)}
.modal-icon{font-size:3.8rem;display:block;margin-bottom:12px}
.modal h2{font-size:1.3rem;margin-bottom:6px}
.modal p{font-size:.85rem;color:#aaa;margin-bottom:20px;line-height:1.5}
.btn{display:inline-block;padding:11px 32px;border-radius:13px;font-size:.95rem;font-weight:700;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:linear-gradient(135deg,#ff6b35,#f7c948);color:#000}
.btn-primary:active{transform:scale(.95)}
.btn-outline{background:transparent;border:1px solid #555;color:#ccc;margin-top:8px}
.elephant-celebrate{font-size:5.5rem;animation:eleBounce 1s infinite}
@keyframes eleBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
.confetti{position:fixed;width:8px;height:8px;border-radius:50%;z-index:200;pointer-events:none;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div id="app">
<div class="bg-layer" id="bgLayer"></div>
<div class="top-bar">
<div class="level-badge" id="levelBadge">第 1 关</div>
<div><div class="score-box" id="scoreBox">0 分</div><div style="font-size:.7rem;color:#888;margin-top:3px">步数: <span id="movesCount">30</span></div></div>
</div>
<div class="target-panel">
<div class="target-title">&#x1F3AF; 消除目标：</div>
<div class="target-items" id="targetItems"></div>
</div>
<div class="grid-container"><div class="grid" id="grid"></div></div>
<div class="hint-bar"><div class="hint-text" id="hintText">&#x1F446; 交换相邻方块，3个以上相同即可消除</div></div>
</div>

<div class="overlay show" id="startOverlay"><div class="modal">
<span class="modal-icon">&#x1F418;</span>
<h2>拯救大象</h2><p>交换相邻小动物，3个以上相同即可消除<br>拯救大象需要你的帮助！</p>
<button class="btn btn-primary" id="startBtn">开始游戏</button>
</div></div>

<div class="overlay" id="winOverlay"><div class="modal">
<span class="modal-icon" id="winIcon">&#x1F389;</span>
<h2 id="winTitle">通关成功！</h2>
<p id="winText"></p>
<button class="btn btn-primary" id="winBtn">下一关</button>
</div></div>

<div class="overlay" id="failOverlay"><div class="modal">
<span class="modal-icon">&#x1F622;</span><h2>步数用完了...</h2>
<p>大象还在危险中<br>再来一次吧！</p>
<button class="btn btn-primary" id="retryBtn">重新挑战</button><br>
<button class="btn btn-outline" id="giveUpBtn">放弃</button>
</div></div>

<div class="overlay" id="finalOverlay"><div class="modal">
<span class="modal-icon elephant-celebrate">&#x1F418;</span>
<h2 style="color:#f7c948;">大象得救了！</h2>
<p>你成功消除了所有危险！<br>大象安全回家了 &#x1F389;</p>
<button class="btn btn-primary" id="restartBtn">再玩一次</button>
</div></div>

<script>
(function(){
var COLS=7,ROWS=7;
var LEVELS=[
{name:'第 1 关',cols:7,rows:7,moves:30,targets:[
{icon:'\uD83D\uDC3B',name:'熊',count:12},
{icon:'\uD83D\uDC2F',name:'老虎',count:10}
],types:['\uD83D\uDC3B','\uD83D\uDC2F','\uD83D\uDC31','\uD83D\uDC36','\uD83D\uDC30']},
{name:'第 2 关',cols:7,rows:7,moves:28,targets:[
{icon:'\uD83D\uDC3B',name:'熊',count:18},
{icon:'\uD83D\uDC2F',name:'老虎',count:15},
{icon:'\uD83D\uDC3A',name:'狼',count:12},
{icon:'\uD83E\uDD8A',name:'狐狸',count:8},
{icon:'\uD83D\uDC34',name:'马',count:8}
],types:['\uD83D\uDC3B','\uD83D\uDC2F','\uD83D\uDC3A','\uD83E\uDD8A','\uD83D\uDC34','\uD83D\uDC31','\uD83D\uDC36','\uD83D\uDC30']}
];

var board=[],currentLevel=0,score=0,movesLeft=0,selected=null,isProcessing=false;
var targets={},totalTarget=0,targetFound=0;

function initBg(){
var layer=document.getElementById('bgLayer');layer.innerHTML='';
var icons=['\uD83D\uDC30','\uD83C\uDF3F','\uD83E\uDD81','\u2728'];
for(var i=0;i<10;i++){
var el=document.createElement('div');
el.className='leaf';el.textContent=icons[i%4];
el.style.left=Math.random()*100+'%';
el.style.animationDuration=(8+Math.random()*10)+'s';
el.style.animationDelay=(Math.random()*8)+'s';
el.style.fontSize=(1+Math.random()*.8)+'rem';
layer.appendChild(el);
}
}

function initLevel(){
var L=LEVELS[currentLevel];
COLS=L.cols;ROWS=L.rows;
movesLeft=L.moves;score=0;selected=null;isProcessing=false;
document.getElementById('levelBadge').textContent=L.name;
updateScore();updateMoves();
targets={};totalTarget=0;targetFound=0;
L.targets.forEach(function(t){
targets[t.icon]={name:t.name,total:t.count,found:0};
totalTarget+=t.count;
});
renderTargets();
createBoard(L.types);
renderBoard();
}

function createBoard(types){
board=[];
for(var r=0;r<ROWS;r++){
board[r]=[];
for(var c=0;c<COLS;c++){
var icon;
do{
icon=types[Math.floor(Math.random()*types.length)];
}while(
(r>=2&&board[r-1][c]===icon&&board[r-2][c]===icon)||
(c>=2&&board[r][c-1]===icon&&board[r][c-2]===icon)
);
board[r][c]=icon;
}
}
}

function renderBoard(){
var g=document.getElementById('grid');
g.innerHTML='';
g.style.gridTemplateColumns='repeat('+COLS+',1fr)';
for(var r=0;r<ROWS;r++){
for(var c=0;c<COLS;c++){
(function(r,c){
var cell=document.createElement('div');
cell.className='cell';
cell.dataset.r=r;cell.dataset.c=c;
cell.textContent=board[r][c];
cell.addEventListener('click',function(){onCellClick(r,c)});
g.appendChild(cell);
})(r,c);
}
}
}

function getCell(r,c){
return document.querySelector(".cell[data-r='"+r+"'][data-c='"+c+"']");
}

function onCellClick(r,c){
if(isProcessing||movesLeft<=0)return;
if(selected){
if(selected.r===r&&selected.c===c){deselect();return}
if(isAdjacent(selected.r,selected.c,r,c)){
swapAndCheck(selected.r,selected.c,r,c);
}else{
deselect();
select(r,c);
}
}else{select(r,c)}
}

function select(r,c){
selected={r:r,c:c};
getCell(r,c).classList.add('selected');
}

function deselect(){
if(!selected)return;
getCell(selected.r,selected.c).classList.remove('selected');
selected=null;
}

function isAdjacent(r1,c1,r2,c2){return Math.abs(r1-r2)+Math.abs(c1-c2)===1}

function swapAndCheck(r1,c1,r2,c2){
isProcessing=true;deselect();
swap(r1,c1,r2,c2);
renderBoard();
getCell(r1,c1).classList.add('swapping');
getCell(r2,c2).classList.add('swapping');

setTimeout(function(){
var matches=findMatches();
if(matches.length>0){
movesLeft--;updateMoves();
processMatches(matches);
}else{
swap(r1,c1,r2,c2);
renderBoard();
showHint('\u274C \u65E0\u6CD5\u6D88\u9664\uFF01');
setTimeout(checkGameOver,300);
}
isProcessing=false},220);
}

function swap(r1,c1,r2,c2){var t=board[r1][c1];board[r1][c1]=board[r2][c2];board[r2][c2]=t}

function findMatches(){
var matched={};
for(var r=0;r<ROWS;r++){
for(var c=0;c<COLS-2;c++){
var v=board[r][c];
if(v&&v===board[r][c+1]&&v===board[r][c+2]){
matched[r+','+c]=true;matched[r+','+(c+1)]=true;matched[r+','+(c+2)]=true;
}}
}
for(var c=0;c<COLS;c++){
for(var r=0;r<ROWS-2;r++){
var v=board[r][c];
if(v&&v===board[r+1][c]&&v===board[r+2][c]){
matched[r+','+c]=true;matched[(r+1)+','+c]=true;matched[(r+2)+','+c]=true;
}}}
var result=[];
Object.keys(matched).forEach(function(key){
var parts=key.split(',');
result.push({r:+parts[0],c:+parts[1]});
});
return result;
}

function processMatches(matches){
var icons={};
matches.forEach(function(m){var icon=board[m.r][m.c];icons[icon]=(icons[icon]||0)+1});
matches.forEach(function(m){var cell=getCell(m.r,m.c);if(cell)cell.classList.add('matching')});

Object.keys(icons).forEach(function(icon){
var cnt=icons[icon];
if(targets[icon]){
var tf=Math.min(cnt,targets[icon].total-targets[icon].found);
targets[icon].found+=tf;targetFound+=tf;
score+=cnt*10;
}else score+=cnt*5;
});
updateScore();renderTargets();

setTimeout(function(){
matches.forEach(function(m){board[m.r][m.c]=''});
dropBlocks();fillEmpty();renderBoard();
for(var cc=0;cc<COLS;cc++)for(var rr=0;rr<ROWS;rr++){var cell=getCell(rr,cc);if(cell&&board[rr][cc])cell.classList.add('falling')}
setTimeout(function(){
var newMatches=findMatches();
if(newMatches.length>0)processMatches(newMatches);else checkGameOver();
},280);
},350);
}

function dropBlocks(){
for(var c=0;c<COLS;c++){
var emptyRow=ROWS-1;
for(var r=ROWS-1;r>=0;r--){
if(board[r][c]!=''){if(r!==emptyRow){board[emptyRow][c]=board[r][c];board[r][c]=''}emptyRow--}
}}
}

function fillEmpty(){
var L=LEVELS[currentLevel],types=L.types;
for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)if(board[r][c]==='')board[r][c]=types[Math.floor(Math.random()*types.length)]
}

function renderTargets(){
var c=document.getElementById('targetItems');c.innerHTML='';
Object.keys(targets).forEach(function(icon){
var info=targets[icon];
var el=document.createElement('div');
el.className='target-item'+(info.found>=info.total?' done':'');
el.id='targ-'+icon;
el.innerHTML='<span class="t-icon">'+icon+'</span>'+info.name+'<span class="t-count">'+info.found+'/'+info.total+'</span>';
c.appendChild(el);
});
}

function updateScore(){document.getElementById('scoreBox').textContent=score+' 分'}
function updateMoves(){document.getElementById('movesCount').textContent=movesLeft}

function checkGameOver(){
if(targetFound>=totalTarget){
gameActive=false;
if(currentLevel<LEVELS.length-1)showWin();else showFinalWin();
}else if(movesLeft<=0)showFail();
}

function showWin(){
document.getElementById('winOverlay').classList.add('show');
document.getElementById('winIcon').textContent='\uD83C\uDF89';
document.getElementById('winTitle').textContent=LEVELS[currentLevel].name+' \u901A\u5173\uFF01';
document.getElementById('winText').textContent='\u5206\u6570 '+score+' \uFF0C\u5927\u8C61\u79BB\u81EA\u7531\u66F4\u8FD1\u4E86\uFF01';
document.getElementById('winBtn').textContent=currentLevel===0?'\u6311\u6218\u7B2C\u4E8C\u5173':'\u7EE7\u7EED';
}

function showFinalWin(){
document.getElementById('winOverlay').classList.remove('show');
document.getElementById('finalOverlay').classList.add('show');
spawnConfetti();
}

function showFail(){document.getElementById('failOverlay').classList.add('show')}

function showHint(msg){
var el=document.getElementById('hintText');el.textContent=msg;el.style.color='#ff6b35';
setTimeout(function(){el.textContent='\u{1F446} \u4EA4\u6362\u76F8\u90BB\u65B9\u5757\uFF0C3\u4E2A\u4EE5\u4E0A\u76F8\u540C\u5373\u53EF\u6D88\u9664';el.style.color='#555'},1500);
}

function spawnConfetti(){
var colors=['#ff6b35','#f7c948','#ec4899','#06b6d4','#22c55e','#a855f7'];
for(var i=0;i<50;i++){setTimeout(function(){
var c=document.createElement('div');c.className='confetti';
c.style.left=Math.random()*100+'%';c.style.top='-20px';
c.style.background=colors[Math.floor(Math.random()*colors.length)];
c.style.animationDuration=(2+Math.random()*2)+'s';
c.style.width=(6+Math.random()*8)+'px';c.style.height=c.style.width;
document.body.appendChild(c);setTimeout(function(){c.remove()},4000);
},i*30)}
}

function startGame(){
document.getElementById('startOverlay').classList.remove('show');
currentLevel=0;initLevel();
}

function nextLevel(){
currentLevel++;
if(currentLevel>=LEVELS.length){showFinalWin();return}
document.getElementById('winOverlay').classList.remove('show');
initLevel();
}

function retryLevel(){
document.getElementById('failOverlay').classList.remove('show');
initLevel();
}

function giveUp(){
document.getElementById('failOverlay').classList.remove('show');
document.getElementById('startOverlay').classList.add('show');
}

function restartGame(){
document.getElementById('finalOverlay').classList.remove('show');
document.getElementById('startOverlay').classList.add('show');
}

document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('winBtn').addEventListener('click',nextLevel);
document.getElementById('retryBtn').addEventListener('click',retryLevel);
document.getElementById('giveUpBtn').addEventListener('click',giveUp);
document.getElementById('restartBtn').addEventListener('click',restartGame);

initBg();
})();

</script>
</body>
</html>
