<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>💎 拯救大象 - 动物消消乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'PingFang SC','Helvetica Neue',Arial,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;overflow-x:hidden;color:#fff;display:flex;flex-direction:column;align-items:center}
.bg-layer{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.bg-layer .leaf{position:absolute;bottom:-20px;animation:floatUp linear infinite}
@keyframes floatUp{0%{transform:translateY(0) rotate(0deg);opacity:.15}100%{transform:translateY(-110vh) rotate(720deg);opacity:0}}

/* Top bar */
.top-bar{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;z-index:10;position:relative}
.score-badge,.moves-badge{background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:6px 14px;font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:6px}
.score-badge{color:#f7c948}.moves-badge{color:#64ffda}

/* Level badge */
.level-badge{font-size:.8rem;color:rgba(255,255,255,.5);letter-spacing:1px;text-transform:uppercase;margin:4px 0 2px;z-index:10;position:relative}

/* Targets */
.targets-bar{width:100%;max-width:480px;display:flex;gap:8px;padding:8px 12px;overflow-x:auto;z-index:10;position:relative;justify-content:center;flex-wrap:wrap}
.target-item{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:4px 10px;font-size:.75rem;white-space:nowrap;transition:all .3s}
.target-item.done{opacity:.4;text-decoration:line-through;border-color:rgba(76,175,80,.3);background:rgba(76,175,80,.08)}
.t-icon{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.t-count{font-weight:700;color:#f7c948}

/* Grid */
.grid-wrap{position:relative;z-index:10;margin:10px auto;padding:6px;background:rgba(255,255,255,.04);border-radius:18px;border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(6px)}
#grid{display:grid;gap:4px;padding:4px}
.cell{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.cell:active{transform:scale(.93)}
.cell.selected{transform:scale(1.08);box-shadow:0 0 16px rgba(255,200,50,.6);border-color:rgba(255,200,50,.5);z-index:2}
.cell.matching{animation:matchPop .3s ease}
@keyframes matchPop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(0)}}
.cell.swapping{transition:transform .18s ease}
.cell.falling{animation:fallIn .25s ease-out}
@keyframes fallIn{0%{transform:translateY(-40px);opacity:0}100%{transform:translateY(0);opacity:1}}

/* Hint */
.hint-bar{font-size:.78rem;color:#aaa;margin:6px 0 2px;z-index:10;position:relative;min-height:20px;text-align:center;transition:color .2s}

/* Overlays */
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .35s}
.overlay.show{opacity:1;pointer-events:auto}
.overlay-card{background:linear-gradient(145deg,#1a1a3e,#2a2a5e);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:36px 30px;text-align:center;max-width:340px;width:90%;transform:scale(.85);transition:transform .35s}
.overlay.show .overlay-card{transform:scale(1)}
.overlay-icon{font-size:3.5rem;margin-bottom:12px;display:block}
.overlay-title{font-size:1.4rem;font-weight:800;margin-bottom:8px}
.overlay-text{font-size:.9rem;color:#aaa;margin-bottom:20px;line-height:1.5}
.btn{padding:12px 32px;border:none;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s;margin:6px}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,#f7c948,#ff9800);color:#1a1a2e;box-shadow:0 4px 20px rgba(247,201,72,.3)}
.btn-danger{background:linear-gradient(135deg,#ff6b35,#e74c3c);color:#fff;box-shadow:0 4px 20px rgba(255,107,53,.3)}
.btn-ghost{background:rgba(255,255,255,.08);color:#aaa;border:1px solid rgba(255,255,255,.15)}

/* Confetti */
.confetti{position:fixed;top:-20px;width:8px;height:8px;z-index:200;animation:confettiFall linear forwards;border-radius:2px}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

.sound-toggle{position:fixed;top:12px;right:12px;z-index:200;font-size:1.4rem;background:rgba(255,255,255,.1);border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(10px);color:#fff}
</style>
</head>

var board=[],currentLevel=0,score=0,movesLeft=0,selected=null,isProcessing=false,gameActive=true;
var targets={},totalTarget=0,targetFound=0;

function initBg(){
var layer=document.getElementById('bgLayer');layer.innerHTML='';
for(var i=0;i<18;i++){
var el=document.createElement('div');el.className='leaf';
var hue=120+Math.random()*80+Math.random()>0.5?0:180;
el.style.cssText='left:'+Math.random()*100+'%;animation-duration:'+(10+Math.random()*15)+'s;animation-delay:'+(Math.random()*12)+'s;width:'+(3+Math.random()*8)+'px;height:'+(3+Math.random()*8)+'px;border-radius:50%;background:hsl('+(120+Math.random()*80)+','+(60+Math.random()*30)+'%,'+(45+Math.random()*25)+'%);opacity:'+(.1+Math.random()*.15)+';position:absolute;bottom:-20px;';
layer.appendChild(el);
}
}

function initLevel(){
var L=LEVELS[currentLevel];COLS=L.cols;ROWS=L.rows;
movesLeft=L.moves;score=0;selected=null;isProcessing=false;gameActive=true;
document.getElementById('levelBadge').textContent=L.name;
updateScore();updateMoves();
targets={};totalTarget=0;targetFound=0;
L.targets.forEach(function(t){targets[t.icon]={name:t.name,total:t.count,found:0,color:t.color};totalTarget+=t.count});
renderTargets();createBoard(L.types);renderBoard();
}

function createBoard(types){
board=[];
for(var r=0;r<ROWS;r++){board[r]=[];for(var c=0;c<COLS;c++){
var icon;do{icon=types[Math.floor(Math.random()*types.length)]}while(
(r>=2&&board[r-1][c]===icon&&board[r-2][c]===icon)||(c>=2&&board[r][c-1]===icon&&board[r][c-2]===icon));
board[r][c]=icon;
}}
}

function renderBoard(){
var g=document.getElementById('grid');g.innerHTML='';
g.style.gridTemplateColumns='repeat('+COLS+',1fr)';
for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)(function(r,c){
var cell=document.createElement('div');cell.className='cell';cell.dataset.r=r;cell.dataset.c=c;
cell.innerHTML=ICONS[board[r][c]]||'';
cell.addEventListener('click',function(){onCellClick(r,c)});g.appendChild(cell);
})(r,c);
}

function getCell(r,c){return document.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"]')}

function onCellClick(r,c){
if(isProcessing||movesLeft<=0||!gameActive)return;
if(selected){
if(selected.r===r&&selected.c===c){deselect();return}
if(isAdjacent(selected.r,selected.c,r,c)){swapAndCheck(selected.r,selected.c,r,c)}
else{deselect();select(r,c)}
}else select(r,c);
}

function select(r,c){selected={r:r,c:c};var cell=getCell(r,c);if(cell)cell.classList.add('selected');sndSelect()}
function deselect(){if(!selected)return;var cell=getCell(selected.r,selected.c);if(cell)cell.classList.remove('selected');selected=null}
function isAdjacent(r1,c1,r2,c2){return Math.abs(r1-r2)+Math.abs(c1-c2)===1}

function swapAndCheck(r1,c1,r2,c2){
isProcessing=true;deselect();
swap(r1,c1,r2,c2);renderBoard();
var a=getCell(r1,c1),b=getCell(r2,c2);
if(a)a.classList.add('swapping');if(b)b.classList.add('swapping');
setTimeout(function(){
var matches=findMatches();
if(matches.length>0){movesLeft--;updateMoves();processMatches(matches)}
else{swap(r1,c1,r2,c2);renderBoard();showHint('\u274C \u65E0\u6CD5\u6D88\u9664\uFF01');sndWrong();setTimeout(checkGameOver,300)}
isProcessing=false},220);
}

function swap(r1,c1,r2,c2){var t=board[r1][c1];board[r1][c1]=board[r2][c2];board[r2][c2]=t}

function findMatches(){
var matched={};
for(var r=0;r<ROWS;r++)for(var c=0;c<COLS-2;c++){var v=board[r][c];if(v&&v===board[r][c+1]&&v===board[r][c+2]){matched[r+','+c]=true;matched[r+','+(c+1)]=true;matched[r+','+(c+2)]=true}}
for(var c=0;c<COLS;c++)for(var r=0;r<ROWS-2;r++){var v=board[r][c];if(v&&v===board[r+1][c]&&v===board[r+2][c]){matched[r+','+c]=true;matched[(r+1)+','+c]=true;matched[(r+2)+','+c]=true}}
var result=[];Object.keys(matched).forEach(function(key){var p=key.split(',');result.push({r:+p[0],c:+p[1]})});
return result;
}

function processMatches(matches){
var icons={};
matches.forEach(function(m){var icon=board[m.r][m.c];icons[icon]=(icons[icon]||0)+1});
matches.forEach(function(m){var cell=getCell(m.r,m.c);if(cell)cell.classList.add('matching')});
sndMatch();
Object.keys(icons).forEach(function(icon){
var cnt=icons[icon];
if(targets[icon]){var tf=Math.min(cnt,targets[icon].total-targets[icon].found);targets[icon].found+=tf;targetFound+=tf;score+=cnt*10}
else score+=cnt*5;
});
updateScore();renderTargets();

setTimeout(function(){
matches.forEach(function(m){board[m.r][m.c]=''});
dropBlocks();fillEmpty();renderBoard();
for(var cc=0;cc<COLS;cc++)for(var rr=0;rr<ROWS;rr++){var cell=getCell(rr,cc);if(cell&&board[rr][cc])cell.classList.add('falling')}
setTimeout(function(){var nm=findMatches();if(nm.length>0){sndCombo();processMatches(nm)}else checkGameOver()},280);
},350);
}

function dropBlocks(){for(var c=0;c<COLS;c++){var er=ROWS-1;for(var r=ROWS-1;r>=0;r--)if(board[r][c]!=''){if(r!==er){board[er][c]=board[r][c];board[r][c]=''}er--}}}
function fillEmpty(){var types=LEVELS[currentLevel].types;for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)if(board[r][c]==='')board[r][c]=types[Math.floor(Math.random()*types.length)]}

function renderTargets(){
var c=document.getElementById('targetItems');c.innerHTML='';
Object.keys(targets).forEach(function(icon){
var info=targets[icon];
var el=document.createElement('div');
el.className='target-item'+(info.found>=info.total?' done':'');
el.id='targ-'+icon;
el.innerHTML='<span class="t-icon">'+ICONS[icon]+'</span>'+info.name+' <span class="t-count">'+info.found+'/'+info.total+'</span>';
c.appendChild(el);
});
}

function updateScore(){document.getElementById('scoreBox').innerHTML=score+' \u5206'}
function updateMoves(){document.getElementById('movesCount').textContent=movesLeft}

function checkGameOver(){
if(targetFound>=totalTarget){gameActive=false;if(currentLevel<LEVELS.length-1)showWin();else showFinalWin()}
else if(movesLeft<=0){gameActive=false;showFail()}
}

function showWin(){
document.getElementById('winOverlay').classList.add('show');
document.getElementById('winIcon').innerHTML=ICONS['rabbit']||'\uD83C\uDF8A';
document.getElementById('winTitle').textContent=LEVELS[currentLevel].name+' \u901A\u5173\uFF01';
document.getElementById('winText').textContent='\u5206\u6570 '+score+' \uFF0C\u5927\u8C61\u79BB\u81EA\u7531\u66F4\u8FD1\u4E86\uFF01';
document.getElementById('winBtn').textContent=currentLevel===0?'\u6311\u6218\u7B2C\u4E8C\u5173':'\u7EE7\u7EED';
initAudio();sndWin();
}

function showFinalWin(){
document.getElementById('winOverlay').classList.remove('show');
document.getElementById('finalOverlay').classList.add('show');
spawnConfetti();initAudio();sndFinal();
}

function showFail(){document.getElementById('failOverlay').classList.add('show');initAudio();sndFail()}

function showHint(msg){var el=document.getElementById('hintText');el.textContent=msg;el.style.color='#ff6b35';setTimeout(function(){el.innerHTML='\u{1F446} \u4EA4\u6362\u76F8\u90BB\u52A8\u7269\uFF0C3 \u4E2A\u4EE5\u4E0A\u76F8\u540C\u5373\u53EF\u6D88\u9664';el.style.color='#aaa'},1500)}

/* Audio */
var audioCtx=null,soundOn=true;
function initAudio(){if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function playTone(freq,dur,type,vol){
if(!soundOn||!audioCtx)return;
var o=audioCtx.createOscillator(),g=audioCtx.createGain();
o.type=type||'sine';o.frequency.value=freq||440;
g.gain.value=vol||0.12;g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+(dur||0.15));
o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+(dur||0.15));
}
function sndSelect(){playTone(700,0.06,'sine',0.08)}
function sndSwap(){playTone(900,0.08,'sine',0.1)}
function sndMatch(){playTone(880,0.15,'triangle',0.13);setTimeout(function(){playTone(1100,0.15,'triangle',0.1)},60)}
function sndCombo(){playTone(1000,0.12,'square',0.08);setTimeout(function(){playTone(1300,0.12,'square',0.06)},50);setTimeout(function(){playTone(1600,0.18,'square',0.08)},100)}
function sndWrong(){playTone(180,0.25,'sawtooth',0.1)}
function sndWin(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){playTone(f,0.3,'sine',0.13)},i*120)})}
function sndFail(){[400,340,280].forEach(function(f,i){setTimeout(function(){playTone(f,0.3,'sawtooth',0.1)},i*200)})}
function sndFinal(){[523,659,784,1047,1319,1568].forEach(function(f,i){setTimeout(function(){playTone(f,0.35,'sine',0.13)},i*100)})}

function spawnConfetti(){
var colors=['#ff6b35','#f7c948','#ec4899','#06b6d4','#22c55e','#a855f7'];
for(var i=0;i<80;i++)setTimeout(function(){
var c=document.createElement('div');c.className='confetti';
c.style.left=Math.random()*100+'%';c.style.top='-20px';
c.style.background=colors[Math.floor(Math.random()*colors.length)];
c.style.animationDuration=(2+Math.random()*3)+'s';
c.style.width=(5+Math.random()*10)+'px';c.style.height=(5+Math.random()*10)+'px';
c.style.borderRadius=Math.random()>.5?'50%':'2px';
document.body.appendChild(c);setTimeout(function(){c.remove()},5000);
},i*20);
}

function startGame(){document.getElementById('startOverlay').classList.remove('show');currentLevel=0;initAudio();initLevel()}
function nextLevel(){currentLevel++;if(currentLevel>=LEVELS.length){showFinalWin();return}document.getElementById('winOverlay').classList.remove('show');initLevel()}
function retryLevel(){document.getElementById('failOverlay').classList.remove('show');initLevel()}
function giveUp(){document.getElementById('failOverlay').classList.remove('show');document.getElementById('startOverlay').classList.add('show')}
function restartGame(){document.getElementById('finalOverlay').classList.remove('show');document.getElementById('startOverlay').classList.add('show')}

document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('winBtn').addEventListener('click',nextLevel);
document.getElementById('retryBtn').addEventListener('click',retryLevel);
document.getElementById('giveUpBtn').addEventListener('click',giveUp);
document.getElementById('restartBtn').addEventListener('click',restartGame);
document.getElementById('soundBtn').addEventListener('click',function(){soundOn=!soundOn;this.innerHTML=soundOn?'\uD83D\uDD0A':'\uD83D\uDD07';this.style.opacity=soundOn?1:0.4;if(soundOn)initAudio()});
initBg();
})();
</script>
